name: pull-request
on:
  pull_request:
    # `labeled`/`unlabeled`: Renovate adds its labels just after it opens the PR, and
    # the dep-changeset gate reads them.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code: # this job name makes the required check `code / all-checks`
    uses: ./.github/workflows/code.yml
    permissions:
      contents: read
      pull-requests: write
    secrets:
      REPOBUDDY_APP_ID: ${{ secrets.REPOBUDDY_APP_ID }}
      REPOBUDDY_APP_PRIVATE_KEY: ${{ secrets.REPOBUDDY_APP_PRIVATE_KEY }}

  publish-gate:
    if: startsWith(github.head_ref, 'changeset-release/')
    uses: repobuddy/.github/.github/workflows/pnpm-publish-gate.yml@v2
    permissions:
      contents: read
